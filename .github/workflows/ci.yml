name: Compilacion y pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Configurar Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build
      - name: Compilar
        run: cmake --build build --config Release --parallel 2
      - name: Verificar
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar AddressSanitizer y UBSan
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTESTORES_SANITIZERS=ON
      - name: Compilar
        run: cmake --build build --parallel 2
      - name: Verificar memoria y comportamiento indefinido
        run: ctest --test-dir build --output-on-failure
